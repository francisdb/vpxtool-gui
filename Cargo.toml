[package]
name = "vpxtool_gui"
version = "0.1.0"
edition = "2024"
# This is an application binary, not a library; never publish to crates.io.
# release-plz still creates git tags and GitHub releases.
publish = false

[[bin]]
name = "vpxtool-gui"
path = "src/main.rs"


[dependencies]
vpxtool = "0.33.2"
bevy = "0.19.0"
bevy_asset = "0.19.0"
bevy_dev_tools = "0.19.0"
#bevy_asset_loader = "0.22.0"
crossbeam-channel = "0.5.15"
is_executable = "1.0.5"
sysinfo = "0.39.3"

[dev-dependencies]
pretty_assertions = "1.4.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Optimize for build time in CI: don't optimize dependencies, so a cold build
# (cache miss) doesn't spend ~40 min optimizing all of Bevy at opt-level 3.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
