name: Release build
# Builds the distributable binaries for a version tag created by release-plz and
# attaches them to the matching GitHub release. Tag-only: no per-commit builds.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    name: Gui Release - ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-24.04
            name: vpxtool-gui-linux-x86_64
            bin_ext: ""
          - os: ubuntu-24.04-arm
            name: vpxtool-gui-linux-arm64
            bin_ext: ""
          - os: windows-latest
            name: vpxtool-windows-x86_64
            bin_ext: ".exe"
          - os: macos-latest
            name: vpxtool-gui-macOS-aarch64
            bin_ext: ""

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Install bevy linux dependencies
        run: sudo apt-get update && sudo apt-get install g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev
        if: contains(matrix.platform.os, 'ubuntu')
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@stable
      # No rust-cache here on purpose: releases are infrequent, so a cache would
      # mostly be evicted between releases while consuming the repo cache budget
      # that the CI workflow needs.
      - name: Build
        run: cargo build --locked --release
      - name: Set full archive name as env variable
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          EXTENSION="tar.gz"
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            EXTENSION="zip"
          fi
          ARCHIVE_DIR=${{ matrix.platform.name }}-${VERSION}
          echo "ARCHIVE_DIR=${ARCHIVE_DIR}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_DIR}.${EXTENSION}" >> $GITHUB_ENV
      - name: Package as archive
        shell: bash
        run: |
          mkdir $ARCHIVE_DIR
          cp target/release/vpxtool-gui${{ matrix.platform.bin_ext }} $ARCHIVE_DIR
          cp -r assets $ARCHIVE_DIR
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            7z a $ARCHIVE_NAME $ARCHIVE_DIR
          else
            tar czvf $ARCHIVE_NAME $ARCHIVE_DIR
          fi
          rm -rf $ARCHIVE_DIR
      - name: Upload archive to the GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Attach the asset to the release release-plz already created for this
        # tag; --clobber replaces it on re-runs and leaves the notes untouched.
        run: gh release upload "${GITHUB_REF#refs/tags/}" "$ARCHIVE_NAME" --clobber --repo "$GITHUB_REPOSITORY"
